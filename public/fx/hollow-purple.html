<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hollow Purple — Kyoshiki Murasaki (SSS)</title>
<style>
  html, body { margin: 0; padding: 0; background: #05050a; }

  :root { color-scheme: dark; }
  .hp-stage {
    position: relative;
    min-height: 100vh;
    margin: 0;
    background: rgba(5, 5, 10, 0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #e9e6f5;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
  }
  .hp-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(60% 50% at 50% 45%, rgba(138, 43, 226, 0.10), transparent 70%),
      radial-gradient(40% 40% at 18% 80%, rgba(0, 191, 255, 0.06), transparent 70%),
      radial-gradient(40% 40% at 82% 20%, rgba(255, 0, 0, 0.05), transparent 70%);
    pointer-events: none;
  }
  /* the tracked avatar — the effect originates on this border */
  .hp-avatar {
    position: relative;
    z-index: 2;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 34% 28%, #2b2340, #0a0812 72%);
    border: 3px solid rgba(200, 170, 255, 0.42);
    box-shadow: 0 0 34px rgba(138, 43, 226, 0.35), inset 0 0 24px rgba(0, 0, 0, 0.9);
    display: grid;
    place-items: center;
    font-size: 54px;
    font-weight: 800;
    line-height: 1;
    color: rgba(240, 236, 255, 0.9);
    text-shadow: 0 0 22px rgba(160, 90, 255, 0.75);
    user-select: none;
  }
  .hp-caption { position: relative; z-index: 2; text-align: center; max-width: 44ch; padding: 0 18px; }
  .hp-caption h1 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #d9c9ff;
  }
  .hp-caption p { margin: 0; font-size: 13px; line-height: 1.7; color: rgba(200, 194, 220, 0.6); }
  .hp-phase {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    z-index: 2;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(190, 150, 255, 0.5);
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-reduced-motion: reduce) { .hp-phase { display: none; } }
</style>
</head>
<body>


<div class="hp-stage">
  <div class="hp-avatar" id="hp-avatar">悟</div>
  <div class="hp-caption">
    <h1>Hollow Purple</h1>
    <p>Lapse Blue and Reversal Red converge on the profile, collide, and erase the space between them.</p>
  </div>
  <div class="hp-phase" id="hp-phase"></div>
</div>

<script>
(() => {
  "use strict";

  /* ── full-screen canvas, appended to <body> so no stacking context clips it ── */
  const canvas = document.createElement("canvas");
  canvas.style.cssText =
    "position:fixed;top:0;left:0;width:100vw;height:100vh;" +
    "z-index:9999;pointer-events:none;mix-blend-mode:screen;";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");

  const avatarEl = document.getElementById("hp-avatar");
  const phaseEl = document.getElementById("hp-phase");

  const TAU = Math.PI * 2;
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, DIAG = 0;

  const resize = () => {
    W = window.innerWidth;
    H = window.innerHeight;
    DIAG = Math.hypot(W, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  resize();
  window.addEventListener("resize", resize);

  /* ── easing ── */
  const easeInExpo = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
  const easeOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
  const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
  const easeInCubic = (x) => x * x * x;
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const lerp = (a, b, k) => a + (b - a) * k;

  /* ── pre-rendered radial glow sprites (drawImage ≫ shadowBlur per particle) ── */
  const makeGlow = (rgb, core) => {
    const s = 128;
    const c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, "rgba(255,255,255," + (core ? 1 : 0.95) + ")");
    grad.addColorStop(core ? 0.16 : 0.1, "rgba(" + rgb + ",1)");
    grad.addColorStop(0.42, "rgba(" + rgb + ",0.42)");
    grad.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = grad;
    g.fillRect(0, 0, s, s);
    return c;
  };
  const SPR = {
    azure: makeGlow("0,191,255", true),
    crimson: makeGlow("255,0,0", true),
    violet: makeGlow("138,43,226", false),
    white: makeGlow("235,225,255", true),
  };

  /* ── phase clock ─────────────────────────────────────────────────────────
     P1 convergence · P2 singularity (frozen micro-silence) · P3 eruption ·
     P4 shatter + dissipation, then a seamless reset. */
  const P1 = 3.4, P2 = 0.42, P3 = 1.35, P4 = 3.05;
  const T1 = P1, T2 = T1 + P2, T3 = T2 + P3, CYCLE = T3 + P4;
  const PHASE_NAME = ["I · CONVERGENCE", "II · THE SPARK", "III · HOLLOW PURPLE", "IV · SPACE SHATTER"];

  /* ── procedural cursed-energy lightning ── */
  const makeArc = (x0, y0, x1, y1, segs, chaos) => {
    const pts = [[x0, y0]];
    for (let i = 1; i < segs; i++) {
      const k = i / segs;
      const nx = -(y1 - y0), ny = x1 - x0;
      const nl = Math.hypot(nx, ny) || 1;
      const off = (Math.random() - 0.5) * chaos * Math.sin(k * Math.PI);
      pts.push([lerp(x0, x1, k) + (nx / nl) * off, lerp(y0, y1, k) + (ny / nl) * off]);
    }
    pts.push([x1, y1]);
    return pts;
  };

  /* arcs that whip around the avatar's border */
  const makeRimArc = (cx, cy, r, a0, span, chaos) => {
    const pts = [];
    const steps = 9;
    for (let i = 0; i <= steps; i++) {
      const a = a0 + span * (i / steps);
      const rr = r + (Math.random() - 0.5) * chaos;
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    return pts;
  };

  const strokePolys = (polys, color, width, alpha) => {
    if (!polys.length) return;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    for (const p of polys) {
      ctx.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  };

  /* ── space-shatter cracks: generated once per cycle at the eruption ── */
  let cracks = [];
  const buildCracks = (cx, cy) => {
    cracks = [];
    const main = 11;
    for (let i = 0; i < main; i++) {
      const a = (i / main) * TAU + Math.random() * 0.5;
      const len = DIAG * (0.55 + Math.random() * 0.5);
      const pts = [[cx, cy]];
      let x = cx, y = cy, ang = a;
      const steps = 7;
      for (let s = 0; s < steps; s++) {
        ang += (Math.random() - 0.5) * 0.5;
        const seg = len / steps;
        x += Math.cos(ang) * seg;
        y += Math.sin(ang) * seg;
        pts.push([x, y]);
      }
      cracks.push({ pts, w: 1.1 + Math.random() * 2.2, delay: Math.random() * 0.22 });
      /* branches split off the mid-section */
      const bn = 1 + (Math.random() * 2) | 0;
      for (let b = 0; b < bn; b++) {
        const at = 2 + ((Math.random() * (pts.length - 3)) | 0);
        let bx = pts[at][0], by = pts[at][1];
        let bang = ang + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.7);
        const bpts = [[bx, by]];
        const bsteps = 3 + ((Math.random() * 3) | 0);
        for (let s = 0; s < bsteps; s++) {
          bang += (Math.random() - 0.5) * 0.6;
          const seg = (DIAG * 0.09) * (0.6 + Math.random() * 0.8);
          bx += Math.cos(bang) * seg;
          by += Math.sin(bang) * seg;
          bpts.push([bx, by]);
        }
        cracks.push({ pts: bpts, w: 0.7 + Math.random() * 1.2, delay: 0.1 + Math.random() * 0.3 });
      }
    }
  };

  /* ── ember particles: the erased trench blowing sideways ── */
  let embers = [];
  const seedEmbers = (cx, cy) => {
    embers = [];
    const n = 190;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU;
      const sp = 60 + Math.random() * 340;
      embers.push({
        x: cx + Math.cos(a) * Math.random() * 90,
        y: cy + Math.sin(a) * Math.random() * 90,
        vx: (Math.random() < 0.5 ? -1 : 1) * (240 + Math.random() * 760),
        vy: (Math.random() - 0.5) * 90 - 18,
        s: 1.2 + Math.random() * 3.6,
        life: 1.1 + Math.random() * 1.9,
        age: 0,
        hot: Math.random() < 0.22,
      });
    }
  };

  /* ── state ── */
  let t = 0, last = performance.now(), raf = 0, paused = false;
  let cycleIndex = -1;
  let shakeUntil = -1;

  const frame = (now) => {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    t += dt;

    const cyc = t % CYCLE;
    const idx = Math.floor(t / CYCLE);

    /* avatar is the origin of everything — tracked live */
    const r = avatarEl.getBoundingClientRect();
    const ax = r.left + r.width / 2;
    const ay = r.top + r.height / 2;
    const arad = r.width / 2;

    /* one-time per-cycle seeding, exactly at the eruption */
    if (idx !== cycleIndex && cyc >= T2) {
      cycleIndex = idx;
      buildCracks(ax, ay);
      seedEmbers(ax, ay);
      shakeUntil = t + 0.4;
    }

    ctx.clearRect(0, 0, W, H);

    /* ── PHASE 1 · CONVERGENCE ─────────────────────────────────────────── */
    if (cyc < T1) {
      const p = cyc / P1;
      /* exponential spin-up; orbit radius collapses to the dead-centre */
      const spin = easeInExpo(p) * 26 + p * 5;
      const orbitR = arad * 1.06 * (1 - easeInExpo(p) * 0.99);
      const orbR = lerp(arad * 0.34, arad * 0.5, easeOutCubic(p));

      const bA = Math.PI + spin;      /* Lapse Blue starts on the left edge  */
      const rA = spin;                /* Reversal Red starts on the right    */
      const bx = ax + Math.cos(bA) * orbitR, by = ay + Math.sin(bA) * orbitR;
      const rx = ax + Math.cos(rA) * orbitR, ry = ay + Math.sin(rA) * orbitR;

      ctx.globalCompositeOperation = "lighter";

      /* trailing after-images sell the acceleration */
      for (let k = 5; k >= 1; k--) {
        const lagA = spin - k * (0.16 + p * 0.3);
        const lr = orbitR;
        const a = (0.16 / k) * (0.4 + p);
        ctx.globalAlpha = a;
        const tbx = ax + Math.cos(Math.PI + lagA) * lr, tby = ay + Math.sin(Math.PI + lagA) * lr;
        const trx = ax + Math.cos(lagA) * lr, try_ = ay + Math.sin(lagA) * lr;
        ctx.drawImage(SPR.azure, tbx - orbR, tby - orbR, orbR * 2, orbR * 2);
        ctx.drawImage(SPR.crimson, trx - orbR, try_ - orbR, orbR * 2, orbR * 2);
      }
      ctx.globalAlpha = 1;

      /* the two spheres */
      const pulse = 1 + 0.09 * Math.sin(t * 22);
      ctx.drawImage(SPR.azure, bx - orbR * 1.55 * pulse, by - orbR * 1.55 * pulse, orbR * 3.1 * pulse, orbR * 3.1 * pulse);
      ctx.drawImage(SPR.crimson, rx - orbR * 1.55 * pulse, ry - orbR * 1.55 * pulse, orbR * 3.1 * pulse, orbR * 3.1 * pulse);

      /* cursed energy: arcs snapping off each orb + whipping round the rim */
      const inten = 0.35 + p * 0.65;
      const halo = [], core = [];
      const nArc = 2 + Math.round(p * 5);
      for (let i = 0; i < nArc; i++) {
        const la = Math.random() * TAU;
        const ll = arad * (0.5 + Math.random() * 0.9);
        core.push(makeArc(bx, by, bx + Math.cos(la) * ll, by + Math.sin(la) * ll, 6, arad * 0.5));
        const la2 = Math.random() * TAU;
        core.push(makeArc(rx, ry, rx + Math.cos(la2) * ll, ry + Math.sin(la2) * ll, 6, arad * 0.5));
      }
      for (let i = 0; i < 3; i++) {
        halo.push(makeRimArc(ax, ay, arad + 5, Math.random() * TAU, 0.7 + Math.random() * 1.5, 11 * inten));
      }
      strokePolys(halo, "rgba(150,90,255,0.55)", 4.5, inten * 0.8);
      strokePolys(halo, "rgba(240,225,255,0.95)", 1.4, inten);
      strokePolys(core, "rgba(90,160,255,0.5)", 3.4, inten * 0.7);
      strokePolys(core, "rgba(255,255,255,0.95)", 1.2, inten);

      /* the space between them starts to glow violet as they close in */
      if (p > 0.45) {
        const g = (p - 0.45) / 0.55;
        ctx.globalAlpha = g * 0.75;
        const vr = arad * (0.5 + g * 1.1);
        ctx.drawImage(SPR.violet, ax - vr, ay - vr, vr * 2, vr * 2);
        ctx.globalAlpha = 1;
      }
    }

    /* ── PHASE 2 · THE SPARK (animation suspended; the vortex shakes) ───── */
    else if (cyc < T2) {
      const p = (cyc - T1) / P2;
      ctx.globalCompositeOperation = "lighter";

      /* frozen white-hot pinpoint, jittering violently */
      const jx = (Math.random() - 0.5) * 7;
      const jy = (Math.random() - 0.5) * 7;
      const cr = arad * (0.30 + 0.08 * Math.sin(p * 40));
      ctx.drawImage(SPR.white, ax + jx - cr, ay + jy - cr, cr * 2, cr * 2);

      /* ultra-dense black + purple vortex — source-over so the black reads */
      ctx.globalCompositeOperation = "source-over";
      const spokes = 46;
      ctx.lineWidth = 2;
      for (let i = 0; i < spokes; i++) {
        const a = (i / spokes) * TAU + p * 26 + Math.random() * 0.1;
        const r0 = arad * (0.16 + Math.random() * 0.2);
        const r1 = r0 + arad * (0.3 + Math.random() * 0.55);
        ctx.strokeStyle = i % 3 === 0 ? "rgba(6,2,12,0.92)" : "rgba(96,26,168,0.75)";
        ctx.beginPath();
        ctx.moveTo(ax + jx + Math.cos(a) * r0, ay + jy + Math.sin(a) * r0);
        ctx.lineTo(ax + jx + Math.cos(a) * r1, ay + jy + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.85;
      const hr = arad * 0.95;
      ctx.drawImage(SPR.violet, ax + jx - hr, ay + jy - hr, hr * 2, hr * 2);
      ctx.globalAlpha = 1;
    }

    /* ── PHASE 3 · HOLLOW PURPLE (the eruption engulfs the screen) ──────── */
    else if (cyc < T3) {
      const p = (cyc - T2) / P3;
      const grow = easeOutExpo(Math.min(p * 1.35, 1));
      const R = arad * 0.3 + grow * DIAG * 0.78;
      const fade = p > 0.62 ? 1 - (p - 0.62) / 0.38 : 1;

      ctx.globalCompositeOperation = "lighter";

      /* aggressive black/violet tearing edge (drawn first, behind the light) */
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = fade * 0.9;
      const teeth = 68;
      ctx.beginPath();
      for (let i = 0; i <= teeth; i++) {
        const a = (i / teeth) * TAU;
        const rr = R * (1.0 + (i % 2 ? 0.11 : 0.02) + Math.sin(i * 3.7 + t * 9) * 0.035);
        const x = ax + Math.cos(a) * rr, y = ay + Math.sin(a) * rr;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = "rgba(24,4,44,0.95)";
      ctx.lineWidth = Math.max(3, R * 0.05);
      ctx.stroke();
      ctx.globalAlpha = 1;

      /* layered radial gradient: blinding white core → neon violet → void */
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(ax, ay, 0, ax, ay, R);
      g.addColorStop(0.00, "rgba(255,255,255," + (0.98 * fade) + ")");
      g.addColorStop(0.13, "rgba(246,232,255," + (0.92 * fade) + ")");
      g.addColorStop(0.30, "rgba(190,110,255," + (0.72 * fade) + ")");
      g.addColorStop(0.58, "rgba(138,43,226," + (0.42 * fade) + ")");
      g.addColorStop(0.82, "rgba(74,16,132," + (0.20 * fade) + ")");
      g.addColorStop(1.00, "rgba(10,2,20,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(ax, ay, R, 0, TAU);
      ctx.fill();

      /* residual blue/red fringing torn apart by the blast (chromatic split) */
      ctx.globalAlpha = fade * 0.5 * (1 - grow);
      const fr = R * 0.5;
      ctx.drawImage(SPR.azure, ax - fr - 14, ay - fr, fr * 2, fr * 2);
      ctx.drawImage(SPR.crimson, ax - fr + 14, ay - fr, fr * 2, fr * 2);
      ctx.globalAlpha = 1;

      /* lightning lashing out along the shell */
      const bolts = [];
      for (let i = 0; i < 7; i++) {
        const a = Math.random() * TAU;
        const r0 = R * 0.45;
        bolts.push(makeArc(
          ax + Math.cos(a) * r0, ay + Math.sin(a) * r0,
          ax + Math.cos(a) * R * 1.02, ay + Math.sin(a) * R * 1.02,
          7, R * 0.16));
      }
      strokePolys(bolts, "rgba(150,80,255,0.6)", 5, fade * 0.75);
      strokePolys(bolts, "rgba(255,250,255,0.95)", 1.6, fade);
    }

    /* ── PHASE 4 · SPACE SHATTER & DISSIPATION ─────────────────────────── */
    else {
      const p = (cyc - T3) / P4;
      const fade = p < 0.14 ? 1 : 1 - (p - 0.14) / 0.86;

      /* the collapsing after-glow of the sphere */
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = clamp01(1 - p * 2.6) * 0.85;
      const ar2 = DIAG * 0.5 * (1 - easeOutCubic(Math.min(p * 2.2, 1)) * 0.72);
      ctx.drawImage(SPR.violet, ax - ar2, ay - ar2, ar2 * 2, ar2 * 2);
      ctx.globalAlpha = 1;

      /* space itself shatters — jagged white cracks, drawn source-over */
      ctx.globalCompositeOperation = "source-over";
      const reveal = easeOutCubic(clamp01(p / 0.3));
      const halo = [], core = [];
      for (const c of cracks) {
        const rv = clamp01((reveal - c.delay) / (1 - c.delay));
        if (rv <= 0) continue;
        const upto = 1 + Math.floor(rv * (c.pts.length - 1));
        const seg = c.pts.slice(0, upto + 1);
        if (seg.length > 1) { halo.push(seg); core.push(seg); }
      }
      strokePolys(halo, "rgba(120,50,210,0.5)", 5, fade * 0.5);
      strokePolys(core, "rgba(255,255,255,0.95)", 1.3, fade * 0.92);

      /* glowing purple embers blown sideways — the erased trench */
      ctx.globalCompositeOperation = "lighter";
      for (let i = embers.length - 1; i >= 0; i--) {
        const e = embers[i];
        e.age += dt;
        if (e.age > e.life) { embers.splice(i, 1); continue; }
        e.vy += 26 * dt;          /* faint gravity */
        e.vx *= 1 - 0.55 * dt;    /* drag */
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        const a = (1 - e.age / e.life) * 0.85;
        const s = e.s * 3.4;
        ctx.globalAlpha = a;
        ctx.drawImage(e.hot ? SPR.white : SPR.violet, e.x - s, e.y - s, s * 2, s * 2);
      }
      ctx.globalAlpha = 1;
    }

    ctx.globalCompositeOperation = "source-over";

    /* violent screen shake for 0.4s from the eruption */
    if (t < shakeUntil) {
      const k = (shakeUntil - t) / 0.4;
      const m = 16 * k * k;
      canvas.style.transform =
        "translate(" + ((Math.random() - 0.5) * m).toFixed(2) + "px," +
        ((Math.random() - 0.5) * m).toFixed(2) + "px)";
    } else if (canvas.style.transform) {
      canvas.style.transform = "";
    }

    if (phaseEl) {
      const pi = cyc < T1 ? 0 : cyc < T2 ? 1 : cyc < T3 ? 2 : 3;
      const label = PHASE_NAME[pi] + "  ·  " + cyc.toFixed(1) + "s / " + CYCLE.toFixed(1) + "s";
      if (phaseEl.textContent !== label) phaseEl.textContent = label;
    }

    if (!paused) raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);

  /* pause when the tab is hidden — guarded so we never stack two loops */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (!paused) { paused = true; cancelAnimationFrame(raf); }
    } else if (paused) {
      paused = false;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });
})();
</script>

</body>
</html>
