<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Web-Slinger — Extreme Rare Effect Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070c; }
  .ws-root {
    position: fixed;
    inset: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    color: #eef3f8;
  }
  .ws-card {
    position: relative;
    z-index: 10;
    background: rgba(15, 20, 30, 0.8);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(34, 211, 238, 0.28);
    border-radius: 20px;
    padding: 44px 60px 38px;
    text-align: center;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.85), inset 0 0 40px rgba(8, 12, 20, 0.6);
    max-width: 92vw;
  }
  .ws-avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 0 auto 22px;
    position: relative;
    background: radial-gradient(circle at 34% 30%, #16324a 0%, #0b1a2a 46%, #04070d 100%);
    border: 2px solid rgba(34, 211, 238, 0.55);
    box-shadow: 0 0 34px rgba(34, 211, 238, 0.35), inset 0 0 26px rgba(0, 0, 0, 0.8);
  }
  .ws-avatar-core {
    position: absolute;
    inset: 16%;
    border-radius: 50%;
    background: conic-gradient(from 130deg,
      rgba(220, 38, 38, 0.55), rgba(37, 99, 235, 0.55),
      rgba(240, 248, 255, 0.35), rgba(8, 14, 24, 0.9), rgba(220, 38, 38, 0.55));
    filter: blur(7px);
    opacity: 0.85;
    animation: wsSpin 14s linear infinite;
  }
  @keyframes wsSpin { to { transform: rotate(360deg); } }
  .ws-chips { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .ws-chip {
    font-size: 10px; font-weight: 800; letter-spacing: 0.18em;
    padding: 4px 10px; border-radius: 999px; text-transform: uppercase;
    color: #a5f3fc;
    border: 1px solid rgba(34, 211, 238, 0.45);
    background: rgba(34, 211, 238, 0.1);
    text-shadow: 0 0 12px rgba(34, 211, 238, 0.7);
  }
  .ws-title {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 900;
    letter-spacing: 0.06em;
    margin: 0 0 4px;
    background: linear-gradient(92deg, #f8fafc 10%, #22d3ee 50%, #ef4444 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .ws-sub {
    font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase;
    color: rgba(165, 190, 210, 0.55); margin-bottom: 20px;
  }
  .ws-price { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
  .ws-price strong { font-size: 22px; color: #fff; text-shadow: 0 0 18px rgba(34, 211, 238, 0.6); }
  .ws-price span { font-size: 12px; color: rgba(165, 190, 210, 0.7); }
  .ws-hint {
    margin-top: 22px; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(165, 190, 210, 0.45);
    animation: wsPulse 4s ease-in-out infinite;
  }
  @keyframes wsPulse { 50% { color: rgba(239, 68, 68, 0.6); } }
  @media (prefers-reduced-motion: reduce) { .ws-avatar-core, .ws-hint { animation: none; } }
</style>
</head>
<body>

<div class="ws-root">
  <div class="ws-card">
    <div class="ws-avatar" id="ws-avatar"><div class="ws-avatar-core"></div></div>
    <div class="ws-chips"><span class="ws-chip">Extreme Rare</span></div>
    <h1 class="ws-title">The Web-Slinger</h1>
    <div class="ws-sub">Profile Effect · High-Tension Web Mechanics</div>
    <div class="ws-price"><strong>12,500</strong><span>Arise Points</span></div>
    <div class="ws-hint">Drag your cursor through the webs — pluck them</div>
  </div>
</div>

<script>
(() => {
  "use strict";
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rand = (a, b) => a + Math.random() * (b - a);
  const AVATAR = document.getElementById("ws-avatar");

  /* ————— GLOBAL SCREEN ESCAPE — exactly as decreed ————— */
  const canvas = document.createElement("canvas");
  document.body.appendChild(canvas);
  canvas.style.cssText =
    "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; " +
    "z-index: 9999; pointer-events: none; mix-blend-mode: normal;";
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, DPR = 1;
  const resize = () => {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  };
  resize();
  window.addEventListener("resize", resize);

  const makeSprite = (inner, mid) => {
    const s = 64, c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    grad.addColorStop(0, inner); grad.addColorStop(0.4, mid); grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.fillRect(0, 0, s, s);
    return c;
  };
  const redEmber = makeSprite("rgba(255,190,190,0.9)", "rgba(220,38,38,0.4)");
  const blueEmber = makeSprite("rgba(190,225,255,0.9)", "rgba(37,99,235,0.4)");
  const holeFeather = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(128,128,0,128,128,128);
    grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(0.82, "rgba(255,255,255,1)"); grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad; g.fillRect(0,0,256,256);
    return c;
  })();

  const mouse = { x: -9999, y: -9999 };
  window.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  // release is an event: touch lift / window exit must un-pluck the strands
  const release = () => { mouse.x = -9999; mouse.y = -9999; };
  window.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") release(); }, { passive: true });
  window.addEventListener("pointercancel", release, { passive: true });
  window.addEventListener("blur", release);
  document.documentElement.addEventListener("mouseleave", release);

  let ax = W/2, ay = H/2, aR = 75;

  // the tangled anchor ring — generated once in unit-radius polar space
  const chords = Array.from({ length: 54 }, () => ({
    a1: rand(0, TAU), r1: rand(1.05, 1.5),
    a2: rand(0, TAU), r2: rand(1.05, 1.5),
  }));

  // seven primary webs: corners + edge midpoints of the VIEWPORT
  const webs = [
    { fx: 0, fy: 0 }, { fx: 1, fy: 0 }, { fx: 0, fy: 1 }, { fx: 1, fy: 1 },
    { fx: 0.5, fy: 0 }, { fx: 0, fy: 0.5 }, { fx: 1, fy: 0.5 },
  ].map((w) => ({ ...w, disp: 0, vel: 0, twistP: rand(0, TAU) }));

  const embers = Array.from({ length: 140 }, () => ({
    fx: Math.random(), fy: Math.random(),
    phase: rand(0, TAU), size: rand(4, 12),
    red: Math.random() < 0.5,
  }));

  const pulses = [];
  let nextPulse = 2.2;

  const drawRing = (t, grow) => {
    // the demo affords ONE batched shadowBlur pass for the cinematic cyan
    // glow (the in-app card version fakes it with stroke passes instead)
    ctx.globalCompositeOperation = "lighter";
    const wob = 1 + 0.02 * Math.sin(t * 1.7);
    ctx.save();
    ctx.shadowBlur = 8;
    ctx.shadowColor = "rgba(34,211,238,0.8)";
    ctx.beginPath();
    for (const c of chords) {
      ctx.moveTo(ax + Math.cos(c.a1) * c.r1 * aR * wob, ay + Math.sin(c.a1) * c.r1 * aR * wob);
      ctx.lineTo(ax + Math.cos(c.a2) * c.r2 * aR * wob, ay + Math.sin(c.a2) * c.r2 * aR * wob);
    }
    ctx.strokeStyle = `rgba(255,255,255,${0.55 * grow})`;
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
  };

  const drawWebs = (t, dt, grow) => {
    ctx.globalCompositeOperation = "lighter";
    for (const w of webs) {
      const tx = w.fx * W, ty = w.fy * H;
      const dx = tx - ax, dy = ty - ay;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;
      const p0x = ax + ux * aR * 0.95, p0y = ay + uy * aR * 0.95;
      const midx = (p0x + tx) / 2, midy = (p0y + ty) / 2;
      const sag = len * 0.055 * (1 - clamp(Math.abs(w.disp) / 110, 0, 0.7));
      const nx = -uy, ny = ux;

      // chord-projection distance — continuous along the whole strand (the
      // old 7-sample test left ~45% of a fullscreen corner strand pluck-dead)
      const cx0 = midx + nx * w.disp, cy0 = midy + ny * w.disp + sag;
      const ex = tx - p0x, ey = ty - p0y;
      const u = clamp(((mouse.x - p0x) * ex + (mouse.y - p0y) * ey) / (ex * ex + ey * ey || 1), 0, 1);
      const invU = 1 - u;
      const qx = invU*invU*p0x + 2*invU*u*cx0 + u*u*tx;
      const qy = invU*invU*p0y + 2*invU*u*cy0 + u*u*ty;
      const minD = Math.hypot(mouse.x - qx, mouse.y - qy);
      const target = minD < 42 ? clamp((mouse.x - midx) * nx + (mouse.y - midy) * ny, -120, 120) : 0;
      w.vel += (170 * (target - w.disp) - 7.5 * w.vel) * dt;
      w.disp += w.vel * dt;

      const cx = midx + nx * w.disp, cy = midy + ny * w.disp + sag;
      ctx.strokeStyle = `rgba(255,255,255,${0.65 * grow})`;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(p0x, p0y);
      ctx.quadraticCurveTo(cx, cy, tx, ty);
      ctx.stroke();
      ctx.strokeStyle = `rgba(186,230,253,${0.3 * grow})`;
      ctx.lineWidth = 0.9;
      for (let k = 0; k < 3; k++) {
        const off = (k - 1) * (8 + 5 * Math.sin(t * 3 + w.twistP + k * 2.1));
        if (k === 1) continue;
        ctx.beginPath();
        ctx.moveTo(p0x + nx * 2 * (k - 1), p0y + ny * 2 * (k - 1));
        ctx.quadraticCurveTo(cx + nx * off, cy + ny * off, tx, ty);
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = "source-over";
  };

  const drawEmbers = (t, grow) => {
    ctx.globalCompositeOperation = "lighter";
    for (const e of embers) {
      const x = e.fx * W + 18 * Math.sin(t * 0.3 + e.phase);
      const y = e.fy * H + 14 * Math.cos(t * 0.23 + e.phase * 1.7);
      ctx.globalAlpha = (0.14 + 0.18 * Math.abs(Math.sin(t * 0.8 + e.phase * 3))) * grow;
      ctx.drawImage(e.red ? redEmber : blueEmber, x - e.size/2, y - e.size/2, e.size, e.size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  };

  const drawPulses = (t, grow) => {
    ctx.globalCompositeOperation = "lighter";
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = (t - pulses[i].t0) / 0.7;
      if (p >= 1) { pulses.splice(i, 1); continue; }
      if (p < 0) continue; // echo pulses are born slightly in the future
      ctx.strokeStyle = pulses[i].red
        ? `rgba(248,113,113,${0.55 * (1 - p) * grow})`
        : `rgba(255,255,255,${0.5 * (1 - p) * grow})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(ax, ay, aR * (1.05 + 1.9 * p), 0, TAU);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  };

  let last = performance.now(), elapsed = 0;
  document.addEventListener("visibilitychange", () => { if (!document.hidden) last = performance.now(); });

  const frame = (now) => {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    elapsed += dt;

    const r = AVATAR.getBoundingClientRect();
    ax = r.left + r.width/2;
    ay = r.top + r.height/2;
    aR = r.width/2;

    const grow = clamp((elapsed - 0.2) / 1.4, 0, 1);

    if (elapsed >= nextPulse) {
      pulses.push({ t0: elapsed, red: Math.random() < 0.45 });
      if (Math.random() < 0.4) pulses.push({ t0: elapsed + 0.12, red: true });
      nextPulse = elapsed + rand(4, 7);
    }

    ctx.clearRect(0, 0, W, H);
    drawEmbers(elapsed, grow);
    drawPulses(elapsed, grow);
    drawRing(elapsed, grow);
    drawWebs(elapsed, dt, grow);
    // punch the avatar's disc out LAST — the tangle wraps the rim instead of
    // scribbling across the face (matches the in-app card version)
    ctx.globalCompositeOperation = "destination-out";
    const hr = aR + 2;
    ctx.drawImage(holeFeather, ax - hr, ay - hr, hr * 2, hr * 2);
    ctx.globalCompositeOperation = "source-over";
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
