<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bankai — Senbonzakura Kageyoshi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020205;
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  /* The spiritual domain: crushing darkness over whatever sits beneath. */
  #domain {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(2, 2, 5, 0.95);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
  }

  #profile-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    will-change: transform;
  }

  #avatar {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 3px solid #8f98a8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    color: rgba(255, 255, 255, 0.92);
    text-shadow: 0 0 18px rgba(255, 105, 180, 0.8);
    background:
      radial-gradient(circle at 32% 28%, #3a3f4d 0%, #14161d 55%, #050508 100%);
    user-select: none;
    transition: border-color 1.2s ease;
  }

  #profile-name {
    color: #cdd6e4;
    font-size: 13px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  /* PHASE 4 — the aura the canvas cannot draw: it belongs to the DOM node. */
  #avatar.domain-active {
    border-color: #ff69b4;
    animation: bankai-aura 2.6s ease-in-out infinite;
  }
  @keyframes bankai-aura {
    0%, 100% {
      box-shadow:
        0 0 22px 5px rgba(255, 105, 180, 0.50),
        0 0 80px 18px rgba(255, 20, 147, 0.24);
    }
    50% {
      box-shadow:
        0 0 34px 9px rgba(255, 105, 180, 0.72),
        0 0 120px 30px rgba(255, 20, 147, 0.36);
    }
  }

  #replay {
    position: fixed;
    right: 18px;
    bottom: 16px;
    z-index: 10000;
    background: rgba(255, 105, 180, 0.08);
    border: 1px solid rgba(255, 105, 180, 0.35);
    color: #ff9dcc;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  #replay:hover { background: rgba(255, 105, 180, 0.18); }
</style>
</head>
<body>

<div id="domain">
  <div id="profile-card">
    <div id="avatar">卍</div>
    <div id="profile-name">Kuchiki</div>
  </div>
</div>
<button id="replay">Bankai</button>

<script>
"use strict";

/* ════════════════════════════════════════════════════════════════════════
   SENBONZAKURA KAGEYOSHI — a four-phase canvas state machine.
   Phase 1  the drop, the shockwave, the reiatsu pillar
   Phase 2  the liquid floor and the rising blade forest
   Phase 3  the hold, then the shattering into a petal tornado
   Phase 4  the domain: petals drift forever, the avatar wears the aura
   ════════════════════════════════════════════════════════════════════════ */

/* ── the canvas escapes every stacking context ─────────────────────────── */
const canvas = document.createElement("canvas");
canvas.style.cssText =
  "position:fixed;top:0;left:0;width:100vw;height:100vh;" +
  "z-index:9999;pointer-events:none;mix-blend-mode:screen;";
document.body.appendChild(canvas);
const ctx = canvas.getContext("2d");

const avatar = document.getElementById("avatar");
const card = document.getElementById("profile-card");

/* ── viewport / epicenter ──────────────────────────────────────────────── */
let W = 0, H = 0, DPR = 1;
let CX = 0, CY = 0, FLOOR_Y = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  const r = avatar.getBoundingClientRect();
  CX = r.left + r.width / 2;
  CY = r.top + r.height / 2;
  FLOOR_Y = Math.min(r.bottom + 110, H - 40);
}
resize();
window.addEventListener("resize", resize);

/* ── timeline (seconds) ────────────────────────────────────────────────── */
const T_DROP_START = 0.45;
const DROP_DUR     = 0.72;
const T_IMPACT     = T_DROP_START + DROP_DUR;      // 1.17
const T_PILLAR_END = T_IMPACT + 1.55;              // 2.72
const T_RIPPLE     = T_IMPACT + 0.55;              // 1.72
const T_RISE       = T_IMPACT + 0.95;              // 2.12
const RISE_DUR     = 0.70;
const RISE_STAGGER = 0.06;
const T_HOLD_END   = T_RISE + RISE_DUR + 9 * RISE_STAGGER + 0.5;  // ≈3.86
const T_SCATTER    = T_HOLD_END;
const SWARM_DUR    = 1.9;
const T_DOMAIN     = T_SCATTER + SWARM_DUR;        // ≈5.76

/* ── violent easing ────────────────────────────────────────────────────── */
const easeInExpo  = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, 10 * p - 10));
const easeOutExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
const easeOutCubic = (p) => 1 - Math.pow(1 - Math.min(p, 1), 3);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const rand = (a, b) => a + Math.random() * (b - a);

/* ── petal sprites: procedural, pre-rendered once, drawn thousands of
      times via raw matrix transforms — the only way 2000+ stay at 60fps ── */
const SPRITES = [];
(function buildSprites() {
  const tints = [
    ["#ff9dcc", "#ff69b4", "#ff1493"],
    ["#ffc4e1", "#ff69b4", "#e91280"],
    ["#ffffff", "#ffb3d9", "#ff1493"],
  ];
  for (const [hi, mid, lo] of tints) {
    for (const size of [10, 14, 19]) {
      const s = document.createElement("canvas");
      const px = size * 2;
      s.width = px; s.height = px;
      const g = s.getContext("2d");
      g.translate(px / 2, px / 2);
      const grad = g.createLinearGradient(0, -size, 0, size);
      grad.addColorStop(0, hi);
      grad.addColorStop(0.55, mid);
      grad.addColorStop(1, lo);
      g.fillStyle = grad;
      /* one sakura petal: a teardrop with the classic notched tip */
      g.beginPath();
      g.moveTo(0, size * 0.95);                                   // stem point
      g.bezierCurveTo( size * 0.62, size * 0.45,  size * 0.55, -size * 0.35,  size * 0.16, -size * 0.78);
      g.lineTo(0, -size * 0.55);                                  // the notch
      g.lineTo(-size * 0.16, -size * 0.78);
      g.bezierCurveTo(-size * 0.55, -size * 0.35, -size * 0.62, size * 0.45, 0, size * 0.95);
      g.closePath();
      g.fill();
      /* a razor of light down one edge so petals read as blades */
      g.strokeStyle = "rgba(255,255,255,0.55)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(0, size * 0.9);
      g.bezierCurveTo(size * 0.5, size * 0.4, size * 0.45, -size * 0.3, size * 0.14, -size * 0.7);
      g.stroke();
      SPRITES.push(s);
    }
  }
})();

/* ── particle: one cherry-blossom petal with two lives (swarm → drift) ── */
class Petal {
  constructor() { this.alive = false; }

  /* born from a shattering blade at (x, y) whose axis points up */
  ignite(x, y) {
    this.alive = true;
    this.x = x; this.y = y;
    const away = Math.atan2(y - CY, x - CX) + rand(-0.6, 0.6);
    const burst = rand(120, 780);                       // explosive expansion
    this.vx = Math.cos(away) * burst + rand(-140, 140);
    this.vy = Math.sin(away) * burst * 0.62 + rand(-220, 60);
    this.dir = Math.random() < 0.5 ? -1 : 1;            // orbit handedness
    this.orbitR = rand(110, Math.max(W, H) * 0.42);
    this.rot = rand(0, Math.PI * 2);
    this.rotV = rand(-7, 7);
    this.flutterF = rand(2.2, 5.4);
    this.seed = rand(0, Math.PI * 2);
    this.sprite = SPRITES[(Math.random() * SPRITES.length) | 0];
    this.scale = rand(0.55, 1.15);
  }

  update(dt, t, swarm) {
    /* swarm ∈ [0..1]: 1 = full tornado, 0 = free drifting domain */
    const dx = this.x - CX;
    const dy = (this.y - CY) / 0.72;                    // elliptical funnel
    const r = Math.hypot(dx, dy) || 1;
    const ang = Math.atan2(dy, dx);

    if (swarm > 0) {
      /* tornado: a radial spring toward each petal's own orbit ring plus a
         hard tangential thrust — thousands of independent orbits that read
         as one storm */
      const spring = (this.orbitR - r) * 3.1;
      const tangential = this.dir * (300 + 480 * (1 - Math.min(r / 640, 1)));
      const ax = (Math.cos(ang) * spring - Math.sin(ang) * tangential) * swarm;
      const ay = (Math.sin(ang) * spring + Math.cos(ang) * tangential) * swarm * 0.72;
      /* curl noise keeps the funnel violent rather than clockwork */
      const cx2 = Math.sin(this.y * 0.011 + t * 5.3 + this.seed) * 220 * swarm;
      const cy2 = Math.cos(this.x * 0.009 - t * 4.1 + this.seed) * 180 * swarm;
      this.vx += (ax + cx2) * dt;
      this.vy += (ay + cy2) * dt;
    }

    /* the domain's flow field, always on, owning the petal as swarm → 0 */
    const drift = 1 - swarm;
    if (drift > 0) {
      const fx = 26 * Math.sin(this.y * 0.005 + t * 0.55 + this.seed)
               + 16 * Math.cos(this.x * 0.004 - t * 0.33) + 21;
      const fy = 14 * Math.cos(this.x * 0.006 + t * 0.42 + this.seed)
               + 9 * Math.sin(t * 0.8 + this.seed) + 11;
      this.vx += (fx - this.vx) * Math.min(1, dt * (0.6 + drift * 1.4));
      this.vy += (fy - this.vy) * Math.min(1, dt * (0.6 + drift * 1.4));
    }

    /* drag scaled for frame-rate independence */
    const drag = Math.pow(0.9, dt * 60 * (0.35 + 0.65 * swarm));
    this.vx *= drag; this.vy *= drag;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rot += (this.rotV * (0.3 + swarm)) * dt;

    /* the domain never empties: petals wrap instead of dying */
    if (drift > 0.5) {
      if (this.x < -44) this.x = W + 40;
      if (this.x > W + 44) this.x = -40;
      if (this.y > H + 44) { this.y = -40; this.x = rand(0, W); }
      if (this.y < -60) this.y = H + 40;
    }
  }

  draw(t, shakeX, shakeY, alpha) {
    /* 3D flip illusion: the petal's width breathes with its flutter phase */
    const flip = 0.32 + 0.68 * Math.abs(Math.sin(t * this.flutterF + this.seed));
    const c = Math.cos(this.rot), s = Math.sin(this.rot);
    const sx = this.scale, sy = this.scale * flip;
    /* raw matrix: rotation × non-uniform scale × DPR, translation baked in */
    ctx.setTransform(
      DPR * c * sx, DPR * s * sx,
      -DPR * s * sy, DPR * c * sy,
      DPR * (this.x + shakeX), DPR * (this.y + shakeY)
    );
    ctx.globalAlpha = alpha;
    ctx.drawImage(this.sprite, -this.sprite.width / 2, -this.sprite.height / 2);
  }
}

/* ── one monolithic katana of the blade forest ─────────────────────────── */
class GiantBlade {
  constructor(offsetX, heightFrac, width, delay) {
    this.offsetX = offsetX;       // signed, relative to the avatar center
    this.heightFrac = heightFrac; // of the viewport height
    this.width = width;
    this.delay = delay;
    this.progress = 0;            // 0 buried → 1 fully risen
    this.shattered = false;
  }

  x() { return CX + this.offsetX * Math.min(W * 0.5, 720); }
  height() { return H * this.heightFrac; }

  update(t) {
    const p = clamp01((t - T_RISE - this.delay) / RISE_DUR);
    this.progress = easeOutExpo(p);
  }

  /* Fully procedural blade: tip curve, straight metallic edges, a fuller
     groove, and a horizontal gradient that fakes a ground edge-light. */
  draw(t, glowPulse) {
    if (this.shattered || this.progress <= 0) return;
    const x = this.x();
    const hgt = this.height() * this.progress;
    const tipY = FLOOR_Y - hgt;
    const w = this.width;

    const grad = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    grad.addColorStop(0.00, "#10131a");
    grad.addColorStop(0.34, "#3c4352");
    grad.addColorStop(0.52, "#e8edf5");   // the razor edge catches the light
    grad.addColorStop(0.58, "#ffffff");
    grad.addColorStop(0.66, "#9aa3b4");
    grad.addColorStop(1.00, "#232833");

    ctx.save();
    /* rising THROUGH the floor: nothing below it may ever be visible */
    ctx.beginPath();
    ctx.rect(0, 0, W, FLOOR_Y);
    ctx.clip();

    ctx.shadowColor = "rgba(255,105,180," + (0.55 + glowPulse * 0.4) + ")";
    ctx.shadowBlur = 26 + glowPulse * 30;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(x, tipY);                                            // the point
    ctx.bezierCurveTo(x + w * 0.30, tipY + hgt * 0.045,
                      x + w * 0.50, tipY + hgt * 0.10,
                      x + w * 0.50, tipY + hgt * 0.14);             // kissaki →
    ctx.lineTo(x + w * 0.50, FLOOR_Y + 4);                          // right edge
    ctx.lineTo(x - w * 0.42, FLOOR_Y + 4);                          // base
    ctx.lineTo(x - w * 0.42, tipY + hgt * 0.16);                    // left edge
    ctx.bezierCurveTo(x - w * 0.42, tipY + hgt * 0.09,
                      x - w * 0.22, tipY + hgt * 0.035,
                      x, tipY);                                     // ← spine
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    /* the fuller — a blood groove shadowing down the flat */
    ctx.strokeStyle = "rgba(8,10,14,0.55)";
    ctx.lineWidth = Math.max(2, w * 0.09);
    ctx.beginPath();
    ctx.moveTo(x - w * 0.16, tipY + hgt * 0.14);
    ctx.lineTo(x - w * 0.16, FLOOR_Y);
    ctx.stroke();

    /* pink rim-light on the cutting edge */
    ctx.strokeStyle = "rgba(255,20,147," + (0.35 + glowPulse * 0.45) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, tipY);
    ctx.bezierCurveTo(x + w * 0.30, tipY + hgt * 0.045,
                      x + w * 0.50, tipY + hgt * 0.10,
                      x + w * 0.50, tipY + hgt * 0.14);
    ctx.lineTo(x + w * 0.50, FLOOR_Y);
    ctx.stroke();

    ctx.restore();
  }

  /* shatter sampling: petals are born from the blade's actual body */
  samplePoints(count, out) {
    const x = this.x();
    const hgt = this.height();
    const tipY = FLOOR_Y - hgt;
    for (let i = 0; i < count; i++) {
      const f = Math.random();                          // 0 tip → 1 base
      const halfW = (this.width / 2) * (0.25 + 0.75 * Math.min(f * 4, 1));
      out.push([x + rand(-halfW, halfW), tipY + f * hgt]);
    }
  }
}

/* ── engine state ──────────────────────────────────────────────────────── */
const PETAL_COUNT = 2300;
const petals = Array.from({ length: PETAL_COUNT }, () => new Petal());

const BLADE_LAYOUT = [
  [-0.82, 0.66, 46], [-0.64, 0.84, 56], [-0.47, 0.58, 38], [-0.33, 0.92, 62], [-0.20, 0.50, 30],
  [ 0.20, 0.54, 32], [ 0.33, 0.90, 60], [ 0.47, 0.62, 40], [ 0.64, 0.80, 54], [ 0.82, 0.70, 48],
];
let blades = [];

let t = 0;
let last = performance.now();
let impactFired = false;
let scatterFired = false;
let shockwaves = [];        // { r, maxR, w, life }
let flash = 0;              // full-screen white flash energy
let shakeMag = 0;
let streaks = [];           // reiatsu pillar risers: { x, y, len, v, a }
let domainArmed = false;

function reset() {
  t = 0;
  impactFired = false;
  scatterFired = false;
  shockwaves = [];
  streaks = [];
  flash = 0;
  shakeMag = 0;
  domainArmed = false;
  for (const p of petals) p.alive = false;
  blades = BLADE_LAYOUT.map(([ox, hf, w], i) =>
    new GiantBlade(ox, hf, w, RISE_STAGGER * Math.abs(i - 4.5) * 2));
  avatar.classList.remove("domain-active");
  resize();
}
reset();
document.getElementById("replay").addEventListener("click", reset);

/* ── the falling katana of phase 1 (point-down, dead vertical) ─────────── */
function drawFallingSword(y) {
  const x = CX;
  const L = 210, w = 13;
  ctx.save();
  ctx.shadowColor = "rgba(255,255,255,0.9)";
  ctx.shadowBlur = 34;

  const grad = ctx.createLinearGradient(x - w, 0, x + w, 0);
  grad.addColorStop(0, "#6b7383");
  grad.addColorStop(0.48, "#ffffff");
  grad.addColorStop(0.55, "#e8edf5");
  grad.addColorStop(1, "#8f98a8");
  ctx.fillStyle = grad;

  /* blade, tip at (x, y) */
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x + w * 0.5, y - L * 0.06, x + w * 0.5, y - L * 0.1, x + w * 0.5, y - L * 0.12);
  ctx.lineTo(x + w * 0.5, y - L);
  ctx.lineTo(x - w * 0.4, y - L);
  ctx.lineTo(x - w * 0.4, y - L * 0.1);
  ctx.closePath();
  ctx.fill();

  /* habaki + tsuba + wrapped tsuka, drawn upward from the blade */
  ctx.shadowBlur = 12;
  ctx.fillStyle = "#cdd6e4";
  ctx.fillRect(x - w * 0.55, y - L - 10, w * 1.1, 10);              // habaki
  ctx.fillStyle = "#14161d";
  ctx.beginPath();
  ctx.ellipse(x, y - L - 15, w * 1.7, 6, 0, 0, Math.PI * 2);       // tsuba
  ctx.fill();
  ctx.strokeStyle = "rgba(255,105,180,0.7)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  const grip = 58;
  ctx.fillStyle = "#1d2029";
  ctx.fillRect(x - w * 0.5, y - L - 15 - grip, w, grip);            // tsuka
  ctx.fillStyle = "rgba(255,105,180,0.55)";
  for (let i = 0; i < 5; i++) {                                     // ito wrap
    const gy = y - L - 15 - grip + 6 + i * 10;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.5, gy);
    ctx.lineTo(x, gy + 5);
    ctx.lineTo(x + w * 0.5, gy);
    ctx.lineTo(x, gy - 5);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = "#8f98a8";
  ctx.fillRect(x - w * 0.6, y - L - 15 - grip - 7, w * 1.2, 7);     // kashira
  ctx.restore();
}

/* ── the reiatsu pillar ────────────────────────────────────────────────── */
function drawPillar(tt) {
  const p = clamp01((tt - T_IMPACT) / (T_PILLAR_END - T_IMPACT));
  const grow = easeOutExpo(Math.min(p * 3, 1));
  const fade = 1 - easeInExpo(clamp01((p - 0.62) / 0.38));
  if (fade <= 0) return;
  const flicker = 0.82 + 0.18 * Math.sin(tt * 47) * Math.sin(tt * 23 + 1.7);
  const wCore = 26 * grow * flicker;
  const wGlow = 120 * grow * flicker;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = fade;

  let g = ctx.createLinearGradient(CX - wGlow, 0, CX + wGlow, 0);
  g.addColorStop(0, "rgba(255,20,147,0)");
  g.addColorStop(0.5, "rgba(255,105,180,0.5)");
  g.addColorStop(1, "rgba(255,20,147,0)");
  ctx.fillStyle = g;
  ctx.shadowColor = "#ff1493";
  ctx.shadowBlur = 90;
  ctx.fillRect(CX - wGlow, 0, wGlow * 2, FLOOR_Y);

  g = ctx.createLinearGradient(CX - wCore, 0, CX + wCore, 0);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(0.5, "rgba(255,255,255,0.95)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.shadowColor = "#ffffff";
  ctx.shadowBlur = 60;
  ctx.fillRect(CX - wCore, 0, wCore * 2, FLOOR_Y);

  /* risers: motes of light screaming upward inside the column */
  ctx.shadowBlur = 0;
  for (const s of streaks) {
    ctx.globalAlpha = fade * s.a;
    ctx.fillStyle = Math.random() < 0.3 ? "#ffffff" : "#ff9dcc";
    ctx.fillRect(s.x - 1.2, s.y, 2.4, s.len);
  }
  ctx.restore();
}

/* ── the liquid floor of phase 2 ───────────────────────────────────────── */
function drawLiquidFloor(tt) {
  const env = clamp01((tt - T_RIPPLE) / 0.8) * (tt < T_SCATTER + 1.2
    ? 1 : Math.max(0, 1 - (tt - T_SCATTER - 1.2) / 1.4));
  if (env <= 0) return;
  ctx.save();
  for (let band = 0; band < 4; band++) {
    const amp = (5 + band * 4.5) * env;
    const yBase = FLOOR_Y + band * 9;
    const alpha = (0.42 - band * 0.09) * env;
    ctx.strokeStyle = band % 2 === 0
      ? "rgba(205,214,228," + alpha + ")"
      : "rgba(255,105,180," + alpha + ")";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 7) {
      const y = yBase
        + Math.sin(x * 0.021 + tt * 3.1 + band * 1.3) * amp
        + Math.sin(x * 0.007 - tt * 1.9 + band) * amp * 0.6;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  /* upside-down shimmer of the forest, cheap and watery */
  ctx.globalAlpha = 0.16 * env;
  ctx.save();
  ctx.translate(0, FLOOR_Y * 2);
  ctx.scale(1, -1);
  for (const b of blades) if (!b.shattered) {
    const x = b.x(), hgt = b.height() * b.progress * 0.4;
    const g = ctx.createLinearGradient(0, FLOOR_Y - hgt, 0, FLOOR_Y);
    g.addColorStop(0, "rgba(255,105,180,0)");
    g.addColorStop(1, "rgba(232,237,245,0.8)");
    ctx.fillStyle = g;
    ctx.fillRect(x - b.width * 0.4, FLOOR_Y - hgt, b.width * 0.8, hgt);
  }
  ctx.restore();
  ctx.restore();
}

/* ── frame ─────────────────────────────────────────────────────────────── */
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;                 // background-tab spike guard
  t += dt;

  /* shake: applied to both the canvas frame and the DOM card */
  shakeMag = Math.max(0, shakeMag - dt * 26);
  const shakeX = shakeMag ? rand(-shakeMag, shakeMag) : 0;
  const shakeY = shakeMag ? rand(-shakeMag, shakeMag) : 0;
  card.style.transform = shakeMag > 0.4
    ? "translate(" + (shakeX * 0.55).toFixed(1) + "px," + (shakeY * 0.55).toFixed(1) + "px)"
    : "";

  ctx.setTransform(DPR, 0, 0, DPR, DPR * shakeX, DPR * shakeY);
  ctx.clearRect(-20, -20, W + 40, H + 40);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  /* ── PHASE 1: the drop ── */
  if (t >= T_DROP_START && t < T_IMPACT) {
    const p = easeInExpo((t - T_DROP_START) / DROP_DUR);
    drawFallingSword(-260 + (FLOOR_Y + 260) * p);
  }

  /* impact: one-shot */
  if (!impactFired && t >= T_IMPACT) {
    impactFired = true;
    shakeMag = 17;
    flash = 0.85;
    const maxR = Math.hypot(Math.max(CX, W - CX), Math.max(FLOOR_Y, H - FLOOR_Y));
    shockwaves.push({ born: t, maxR: maxR * 1.15, dur: 0.7, wide: 30, neg: false });
    shockwaves.push({ born: t, maxR: maxR * 0.95, dur: 0.8, wide: 16, neg: true });
    for (let i = 0; i < 90; i++) {
      streaks.push({
        x: CX + rand(-70, 70) * Math.random(),
        y: rand(FLOOR_Y * 0.1, FLOOR_Y),
        len: rand(14, 60),
        v: rand(700, 1600),
        a: rand(0.4, 1),
      });
    }
  }

  /* the sword stays planted until the forest takes over */
  if (impactFired && t < T_RISE + 0.2) drawFallingSword(FLOOR_Y);

  /* shockwaves: white ring + a ring of pure negation behind it */
  for (const sw of shockwaves) {
    const p = clamp01((t - sw.born) / sw.dur);
    if (p >= 1) continue;
    const r = sw.maxR * easeOutExpo(p);
    const lw = sw.wide * (1 - p) + 2;
    ctx.save();
    if (sw.neg) {
      /* punch transparency: through screen-blending this reads as a black
         void ring chasing the white one — the inverted wave */
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "rgba(0,0,0,1)";
    } else {
      ctx.strokeStyle = "rgba(255,255,255," + (0.95 * (1 - p)) + ")";
      ctx.shadowColor = "#ff69b4";
      ctx.shadowBlur = 40 * (1 - p);
    }
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.arc(CX, FLOOR_Y, Math.max(r, 1), 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  /* pillar + its risers */
  if (impactFired && t < T_PILLAR_END + 0.2) {
    for (const s of streaks) { s.y -= s.v * dt; if (s.y + s.len < 0) s.y = FLOOR_Y; }
    drawPillar(t);
  }

  /* ── PHASE 2: liquid floor + the rising forest ── */
  drawLiquidFloor(t);
  const holdPulse = t > T_RISE
    ? 0.5 + 0.5 * Math.sin((t - T_RISE) * 6)
    : 0;
  for (const b of blades) { b.update(t); b.draw(t, holdPulse * clamp01((t - T_RISE) / 0.5)); }

  /* ── PHASE 3: the shattering ── */
  if (!scatterFired && t >= T_SCATTER) {
    scatterFired = true;
    shakeMag = 22;
    flash = 1;
    const perBlade = Math.floor(PETAL_COUNT / blades.length);
    const pts = [];
    let idx = 0;
    for (const b of blades) {
      pts.length = 0;
      b.samplePoints(perBlade, pts);
      b.shattered = true;
      for (const [px, py] of pts) {
        if (idx < petals.length) petals[idx++].ignite(px, py);
      }
    }
    while (idx < petals.length) {            // remainder: born of the pillar
      petals[idx].ignite(CX + rand(-30, 30), rand(FLOOR_Y * 0.3, FLOOR_Y));
      idx++;
    }
  }

  /* petals: swarm weight collapses 1 → 0 across the calming */
  if (scatterFired) {
    const swarm = 1 - easeOutCubic(clamp01((t - T_SCATTER) / SWARM_DUR));
    /* blinding while shattering, razor-solid once drifting */
    const additivePhase = clamp01(1 - (t - T_SCATTER) / 1.25);
    ctx.globalCompositeOperation = additivePhase > 0.02 ? "lighter" : "source-over";
    const alpha = 0.88 + 0.12 * additivePhase;
    for (const p of petals) {
      if (!p.alive) continue;
      p.update(dt, t, swarm);
      p.draw(t, shakeX, shakeY, alpha);
    }
    ctx.setTransform(DPR, 0, 0, DPR, DPR * shakeX, DPR * shakeY);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ── PHASE 4: the domain settles ── */
  if (!domainArmed && t >= T_DOMAIN) {
    domainArmed = true;
    avatar.classList.add("domain-active");
  }

  /* impact / shatter flash, always last, always additive */
  if (flash > 0.01) {
    flash = Math.max(0, flash - dt * 2.4);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(CX, FLOOR_Y, 0, CX, FLOOR_Y, Math.max(W, H));
    g.addColorStop(0, "rgba(255,255,255," + flash + ")");
    g.addColorStop(0.35, "rgba(255,105,180," + flash * 0.5 + ")");
    g.addColorStop(1, "rgba(255,20,147,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
