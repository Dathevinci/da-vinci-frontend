<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outer God — profile-card harness</title>
<style>
  /* Replicates the PROFILE CARD layer stack exactly:
     card bg → banner (z-1) → washes (z-6) → effect canvas (z-8) → text (z-10).
     Used to tune the effect's visibility without needing a logged-in profile. */
  html, body { margin: 0; padding: 0; background: #060608; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    color: #fff;
  }
  .card {
    position: relative;
    width: 370px;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(20, 184, 166, 0.5);
    background: linear-gradient(to bottom, #101014, #0a0a0e);
    box-shadow: 0 0 50px rgba(13, 148, 136, 0.4), 0 0 24px rgba(216, 31, 180, 0.25);
  }
  .banner {
    position: relative; z-index: 1;
    height: 96px;
    background: linear-gradient(120deg, #0f3d3a, #1a0b26 55%, #3d0f33);
  }
  .wash1, .wash2 { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .wash1 { background: radial-gradient(120% 100% at 50% 25%, rgba(2,10,12,0.72), rgba(2,5,8,0.55) 55%, rgba(1,2,4,0.42) 100%); }
  .wash2 { background: radial-gradient(70% 55% at 50% 28%, rgba(0,128,128,0.2), transparent 68%); }
  canvas.fx { position: absolute; inset: 0; z-index: 8; width: 100%; height: 100%; pointer-events: none; }
  canvas.fxglow { position: absolute; inset: 0; z-index: 30; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
  .content { position: relative; z-index: 10; padding: 0 24px 24px; }
  .avatar {
    position: relative;
    width: 96px; height: 96px;
    margin-top: -48px;
    border-radius: 50%;
    border: 3px solid #0a0a0e;
    background: radial-gradient(circle at 34% 30%, #123b3e, #071a20 50%, #02060a);
    box-shadow: 0 0 22px rgba(0, 150, 140, 0.45);
  }
  .name {
    margin: 12px 0 2px;
    font-size: 26px; font-weight: 900; line-height: 1.15;
    background: linear-gradient(to right, #99f6e4, #14b8a6, #d81fb4, #14b8a6, #99f6e4);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(13, 148, 136, 0.6));
  }
  .handle { font-size: 13px; font-weight: 600; color: #94a3b8; }
  .bio {
    margin-top: 14px; padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.3);
    font-size: 12.5px; line-height: 1.55; color: #cbd5e1;
  }
  .bio b { display: block; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #64748b; margin-bottom: 4px; }
  .stats { display: flex; gap: 8px; margin-top: 12px; }
  .stat { flex: 1; padding: 10px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); text-align: center; }
  .stat i { display: block; font-style: normal; font-size: 16px; font-weight: 900; color: #fff; }
  .stat span { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #64748b; }
  .buttons { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; height: 38px; border: 0; border-radius: 11px; font-size: 12.5px; font-weight: 800; color: #fff; cursor: pointer; }
  .btn.follow { background: linear-gradient(90deg, #7c3aed, #c026d3); }
  .btn.msg { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="banner"></div>
  <div class="wash1"></div>
  <div class="wash2"></div>
  <canvas class="fx" id="fx"></canvas>
  <canvas class="fxglow" id="fxglow"></canvas>
  <div class="content">
    <div class="avatar" id="og-avatar"></div>
    <div class="name">Va'runel</div>
    <div class="handle">@herald_of_the_deep · Heart Rank IV</div>
    <div class="bio"><b>About me</b>It noticed me on a Tuesday. I have not slept since, and I no longer wish to. The tide in my head is warm.</div>
    <div class="stats">
      <div class="stat"><i>412</i><span>Watched</span></div>
      <div class="stat"><i>96</i><span>Followers</span></div>
      <div class="stat"><i>10.8k</i><span>Arise Pts</span></div>
    </div>
    <div class="buttons">
      <button class="btn follow">Follow</button>
      <button class="btn msg">Message</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  // ——— identical draw code to OuterGod.tsx, with the tuned visibility pass ———
  const TAU = Math.PI * 2;
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const rand = (a, b) => a + Math.random() * (b - a);
  const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

  const canvas = document.getElementById("fx");
  const glowCanvas = document.getElementById("fxglow");
  const AVATAR = document.getElementById("og-avatar");
  const ctx = canvas.getContext("2d");
  const gctx = glowCanvas.getContext("2d");
  const scene = document.createElement("canvas");
  const sctx = scene.getContext("2d");
  const chan = document.createElement("canvas");
  const chctx = chan.getContext("2d");

  let W = 0, H = 0;
  const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  const resize = () => {
    W = Math.max(1, canvas.clientWidth);
    H = Math.max(1, canvas.clientHeight);
    for (const c of [canvas, glowCanvas, scene, chan]) {
      c.width = Math.max(1, Math.round(W * DPR));
      c.height = Math.max(1, Math.round(H * DPR));
    }
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    chctx.setTransform(1, 0, 0, 1, 0, 0);
  };
  resize();
  window.addEventListener("resize", resize);

  const makeSprite = (inner, mid) => {
    const s = 128, c = document.createElement("canvas");
    c.width = c.height = s;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    grad.addColorStop(0, inner); grad.addColorStop(0.35, mid); grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.fillRect(0, 0, s, s);
    return c;
  };
  const tealGlow = makeSprite("rgba(120,255,242,0.9)", "rgba(0,128,128,0.4)");
  const magentaGlow = makeSprite("rgba(255,120,235,0.9)", "rgba(216,31,180,0.35)");
  const corpseGlow = makeSprite("rgba(240,244,236,0.85)", "rgba(180,190,180,0.28)");
  const holeFeather = (() => {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(128,128,0,128,128,128);
    grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(0.8, "rgba(255,255,255,1)"); grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad; g.fillRect(0,0,256,256);
    return c;
  })();

  const mouseClient = { x: innerWidth / 2, y: innerHeight / 3 };
  window.addEventListener("pointermove", (e) => { mouseClient.x = e.clientX; mouseClient.y = e.clientY; }, { passive: true });

  let ax = 0, ay = 0, aR = 48, mx = 0, my = 0;

  const pathCatmull = (g, p, continued) => {
    if (continued) g.lineTo(p[0].x, p[0].y); else g.moveTo(p[0].x, p[0].y);
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[Math.max(0, i-1)], p1 = p[i], p2 = p[i+1], p3 = p[Math.min(p.length-1, i+2)];
      g.bezierCurveTo(p1.x+(p2.x-p0.x)/6, p1.y+(p2.y-p0.y)/6, p2.x-(p3.x-p1.x)/6, p2.y-(p3.y-p1.y)/6, p2.x, p2.y);
    }
  };
  const distToEdge = (x, y, ang) => {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    let d = 1e9;
    if (dx > 1e-6) d = Math.min(d, (W-x)/dx);
    if (dx < -1e-6) d = Math.min(d, (0-x)/dx);
    if (dy > 1e-6) d = Math.min(d, (H-y)/dy);
    if (dy < -1e-6) d = Math.min(d, (0-y)/dy);
    return Math.max(d, 40);
  };

  const SEG = 22;
  const tents = Array.from({ length: 5 }, (_, i) => ({
    baseAng: (i/5)*TAU + rand(-0.22, 0.22),
    w1: rand(0.16,0.28), k1: rand(2.2,3.4), p1: rand(0,TAU), a1: rand(0.5,0.72),
    w2: rand(0.06,0.13), k2: rand(4.5,6.5), p2: rand(0,TAU), a2: rand(0.32,0.55),
    w3: rand(0.2,0.33), w4: rand(0.05,0.1), k3: rand(1.5,2.8), a3: rand(0.15,0.26),
    wanderW: rand(0.05,0.11), wanderP: rand(0,TAU),
    reachW: rand(0.04,0.08), reachP: rand(0,TAU),
    hasEyes: i % 2 === 1,
    grow: 0,
  }));

  const spinePoints = (T, t) => {
    const reach = 0.5 + 0.42 * (0.5 + 0.5 * Math.sin(t*T.reachW + T.reachP));
    const L = distToEdge(ax, ay, T.baseAng) * reach * T.grow;
    const step = Math.max(L, 1) / SEG;
    const ang0 = T.baseAng + Math.sin(t*T.wanderW + T.wanderP) * 0.35;
    let x = ax + Math.cos(T.baseAng)*aR*0.55, y = ay + Math.sin(T.baseAng)*aR*0.55;
    const pts = [];
    for (let i = 0; i <= SEG; i++) {
      pts.push({x, y});
      const s = i/SEG;
      const bend =
        Math.sin(t*T.w1 + s*T.k1 + T.p1)*T.a1*s +
        Math.sin(t*T.w2 + s*T.k2 + T.p2)*T.a2*s*s +
        Math.sin(t*T.w3 + Math.sin(t*T.w4 + s*T.k3)*2.0)*T.a3*s;
      const a = ang0 + bend;
      x += Math.cos(a)*step; y += Math.sin(a)*step;
    }
    return pts;
  };

  const drawTentacle = (T, t) => {
    const pts = spinePoints(T, t);
    const w0 = aR * 0.34 * Math.min(1, T.grow * 1.4);
    const left = [], right = [], widths = [], normals = [];
    for (let i = 0; i < pts.length; i++) {
      const pA = pts[Math.max(0,i-1)], pB = pts[Math.min(pts.length-1,i+1)];
      let nx = -(pB.y-pA.y), ny = pB.x-pA.x;
      const nl = Math.hypot(nx,ny)||1; nx/=nl; ny/=nl;
      const s = i/(pts.length-1);
      const w = w0*Math.pow(1-s,1.18)+1.3;
      widths.push(w); normals.push({x:nx,y:ny});
      left.push({x:pts[i].x+nx*w, y:pts[i].y+ny*w});
      right.push({x:pts[i].x-nx*w, y:pts[i].y-ny*w});
    }
    sctx.beginPath();
    pathCatmull(sctx, left, false);
    pathCatmull(sctx, right.slice().reverse(), true);
    sctx.closePath();
    const tip = pts[pts.length-1];
    const g = sctx.createLinearGradient(pts[0].x, pts[0].y, tip.x, tip.y);
    g.addColorStop(0, "rgba(2,5,7,0.96)");
    g.addColorStop(0.55, "rgba(7,22,26,0.94)");
    g.addColorStop(1, "rgba(18,84,86,0.92)");
    sctx.fillStyle = g;
    sctx.fill();
    gctx.beginPath();
    pathCatmull(gctx, left, false);
    gctx.strokeStyle = "rgba(45,215,205,0.6)";
    gctx.lineWidth = 2;
    gctx.stroke();

    const cups = [];
    for (let i = 3; i < pts.length-2; i += 3) {
      const s = i/(pts.length-1);
      if (s < 0.14 || s > 0.9) continue;
      const n = normals[i];
      const toC = (ax-pts[i].x)*n.x + (ay-pts[i].y)*n.y;
      const sgn = toC > 0 ? 1 : -1;
      cups.push({ x: pts[i].x+n.x*sgn*widths[i]*0.55, y: pts[i].y+n.y*sgn*widths[i]*0.55, r: Math.max(widths[i]*0.4, 1) });
    }
    sctx.fillStyle = "rgba(226,232,222,0.45)";
    sctx.beginPath();
    for (const c of cups) { sctx.moveTo(c.x+c.r, c.y); sctx.arc(c.x, c.y, c.r, 0, TAU); }
    sctx.fill();
    sctx.fillStyle = "rgba(5,24,26,0.85)";
    sctx.beginPath();
    for (const c of cups) { const r2 = c.r*0.5; sctx.moveTo(c.x+r2, c.y); sctx.arc(c.x, c.y, r2, 0, TAU); }
    sctx.fill();

    if (T.hasEyes && T.grow > 0.6) {
      for (const idx of [7, 14]) {
        const p = pts[idx], q = pts[idx+1];
        const tang = Math.atan2(q.y-p.y, q.x-p.x);
        const w = widths[idx];
        sctx.save();
        sctx.translate(p.x, p.y);
        sctx.rotate(tang);
        sctx.fillStyle = "rgba(230,235,228,0.8)";
        sctx.beginPath();
        sctx.ellipse(0, 0, w*0.55, w*0.3, 0, 0, TAU);
        sctx.fill();
        const pa = Math.atan2(my-p.y, mx-p.x) - tang;
        sctx.fillStyle = "#d81fb4";
        sctx.beginPath();
        sctx.arc(Math.cos(pa)*w*0.18, Math.sin(pa)*w*0.1, Math.max(w*0.14, 1), 0, TAU);
        sctx.fill();
        sctx.restore();
      }
    }
  };

  const voidLayers = [
    { base: 1.58, rot: 0.0, rs: 0.05, pw: 0.9, seed: 11, K: 24 },
    { base: 1.34, rot: 2.1, rs: -0.075, pw: 1.3, seed: 37, K: 20 },
    { base: 1.14, rot: 4.2, rs: 0.06, pw: 1.7, seed: 71, K: 26 },
  ];
  const drawVoid = (t, growV) => {
    gctx.globalCompositeOperation = "lighter";
    const pulse = 0.5 + 0.5*Math.sin(t*0.7);
    gctx.globalAlpha = (0.55 + 0.2*pulse) * growV;
    const gs = aR * 5.2 * growV;
    gctx.drawImage(tealGlow, ax-gs/2, ay-gs/2, gs, gs);
    gctx.globalAlpha = (0.3 + 0.14*(1-pulse)) * growV;
    const ms = aR * 3.3 * growV;
    gctx.drawImage(magentaGlow, ax-ms/2, ay-ms/2, ms, ms);
    gctx.globalAlpha = 1;
    gctx.globalCompositeOperation = "source-over";

    for (let li = 0; li < voidLayers.length; li++) {
      const L = voidLayers[li];
      const rot = L.rot + t*L.rs;
      sctx.beginPath();
      for (let i = 0; i < L.K; i++) {
        const a = rot + (i/L.K)*TAU;
        const jag = hash(i*7.13 + L.seed);
        const fang = jag > 0.7 ? 1.28 + 0.22*Math.sin(t*1.1 + i*3.1) : 1 - 0.1*jag;
        const r = L.base * aR * growV * (1 + 0.13*Math.sin(t*L.pw + i*2.7)) * fang;
        const x = ax + Math.cos(a)*r, y = ay + Math.sin(a)*r;
        if (i === 0) sctx.moveTo(x, y); else sctx.lineTo(x, y);
      }
      sctx.closePath();
      sctx.fillStyle = "rgba(0,0,0,1)";
      sctx.fill();
      if (li === 0) { sctx.strokeStyle = "rgba(0,190,180,0.55)"; sctx.lineWidth = 2; sctx.stroke(); }
      else if (li === 1) { sctx.strokeStyle = "rgba(216,31,180,0.3)"; sctx.lineWidth = 1.3; sctx.stroke(); }
    }
  };

  let mist = null;
  const spawnMote = (anywhere) => ({
    ang: rand(0, TAU),
    rad: aR * (anywhere ? rand(1.15, 4.2) : rand(3.8, 4.4)),
    swirl: rand(0.5, 1.4) * (Math.random() < 0.85 ? 1 : -1),
    pull: rand(8, 22),
    size: rand(10, 30),
    a: rand(0.16, 0.42),
    tint: Math.random(),
  });
  const drawMist = (dt, growM) => {
    if (!mist) mist = Array.from({ length: 64 }, () => spawnMote(true));
    gctx.globalCompositeOperation = "lighter";
    const maxR = aR * 4.4;
    for (const p of mist) {
      p.rad -= (p.pull + 16*(1 - p.rad/maxR)) * dt;
      p.ang += (p.swirl * 40 / Math.max(p.rad, 22)) * dt;
      if (p.rad < aR*0.95) Object.assign(p, spawnMote(false));
      const x = ax + Math.cos(p.ang)*p.rad, y = ay + Math.sin(p.ang)*p.rad;
      const edgeFade = clamp01((maxR-p.rad)/(aR*0.9)) * clamp01((p.rad-aR)/(aR*0.5));
      gctx.globalAlpha = p.a * edgeFade * growM;
      const spr = p.tint < 0.1 ? corpseGlow : p.tint < 0.2 ? magentaGlow : tealGlow;
      gctx.drawImage(spr, x-p.size/2, y-p.size/2, p.size, p.size);
    }
    gctx.globalAlpha = 1;
    gctx.globalCompositeOperation = "source-over";
  };

  const EYE_ZONES = [[0.16,0.14],[0.84,0.12],[0.12,0.6],[0.88,0.58],[0.5,0.84],[0.2,0.88],[0.8,0.86]];
  const gaze = { state: "idle", t: 0, eyes: [], next: 5, watchDur: 4 };
  const glitches = [];

  const openGaze = (elapsed) => {
    const zones = EYE_ZONES.slice();
    for (let i = zones.length-1; i > 0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [zones[i], zones[j]] = [zones[j], zones[i]];
    }
    const n = 2 + Math.floor(Math.random()*2);
    const eyes = [];
    for (const z of zones) {
      if (eyes.length >= n) break;
      const x = z[0]*W + rand(-0.03,0.03)*W;
      const y = z[1]*H + rand(-0.03,0.03)*H;
      const rx = Math.min(W,H)*rand(0.14,0.2);
      if (Math.hypot(x-ax, y-ay) < aR*2.1 + rx*0.6) continue;
      const irisR = rx*0.55;
      const ig = sctx.createRadialGradient(0,0,0,0,0,irisR);
      ig.addColorStop(0, "#ff9df0"); ig.addColorStop(0.18, "#e93fd0"); ig.addColorStop(0.45, "#8b12a8");
      ig.addColorStop(0.75, "rgba(60,6,90,0.6)"); ig.addColorStop(1, "rgba(20,2,40,0)");
      const veins = [];
      for (let v = 0; v < 5; v++) {
        const side = v % 2 === 0 ? -1 : 1;
        const pts = [{ x: side*rx*0.95, y: rand(-5,5) }];
        for (let s = 1; s <= 3; s++) pts.push({ x: side*rx*(0.95-s*0.22)+rand(-4,4), y: rand(-rx*0.12, rx*0.12) });
        veins.push(pts);
      }
      eyes.push({ x, y, rx, ry: rx*rand(0.4,0.52), tilt: rand(-0.16,0.16), delay: eyes.length*0.18,
        irisR, irisGrad: ig, veins, blinkAt: elapsed+rand(1.8,3.4), blinkT: -1 });
    }
    gaze.eyes = eyes; gaze.state = "opening"; gaze.t = 0; gaze.watchDur = rand(3.2, 4.8);
    glitches.length = 0;
    glitches.push({ at: elapsed+0.12, dur: 0.45 });
    glitches.push({ at: elapsed+1.5+Math.random()*1.6, dur: 0.28 });
    if (Math.random() < 0.5) glitches.push({ at: elapsed+3.1, dur: 0.22 });
  };

  const eyeOpenness = (e, elapsed) => {
    let open = 0;
    if (gaze.state === "opening") open = easeOutCubic(clamp01((gaze.t - e.delay)/1.1));
    else if (gaze.state === "watching") open = 1;
    else if (gaze.state === "closing") open = 1 - clamp01(gaze.t/0.7);
    if (gaze.state === "watching") {
      if (e.blinkT < 0 && elapsed >= e.blinkAt) { e.blinkT = 0; e.blinkAt = elapsed + rand(1.6,3.2); }
      if (e.blinkT >= 0) {
        open *= 1 - 0.92*Math.sin(Math.PI*clamp01(e.blinkT/0.22));
        if (e.blinkT > 0.22) e.blinkT = -1;
      }
    }
    return open;
  };

  const drawEye = (e, open) => {
    if (open <= 0.02) return;
    sctx.save();
    sctx.translate(e.x, e.y);
    sctx.rotate(e.tilt);
    const ry = e.ry * open;
    gctx.globalCompositeOperation = "lighter";
    gctx.globalAlpha = 0.5 * open;
    const gs = e.rx * 2.6;
    gctx.drawImage(magentaGlow, e.x-gs/2, e.y-gs/2, gs, gs);
    gctx.globalAlpha = 1;
    gctx.globalCompositeOperation = "source-over";
    sctx.beginPath();
    sctx.moveTo(-e.rx, 0);
    sctx.quadraticCurveTo(0, -ry*2, e.rx, 0);
    sctx.quadraticCurveTo(0, ry*2, -e.rx, 0);
    sctx.closePath();
    sctx.fillStyle = "rgba(8,3,15,0.94)";
    sctx.fill();
    sctx.save();
    sctx.clip();
    sctx.strokeStyle = "rgba(216,60,120,0.3)";
    sctx.lineWidth = 1.1;
    sctx.beginPath();
    for (const vn of e.veins) {
      sctx.moveTo(vn[0].x, vn[0].y);
      for (let i = 1; i < vn.length; i++) sctx.lineTo(vn[i].x, vn[i].y);
    }
    sctx.stroke();
    sctx.fillStyle = e.irisGrad;
    sctx.beginPath();
    sctx.arc(0, 0, e.irisR, 0, TAU);
    sctx.fill();
    sctx.strokeStyle = "rgba(255,180,240,0.18)";
    sctx.lineWidth = 1;
    sctx.beginPath();
    for (let k = 0; k < 18; k++) {
      const a = (k/18)*TAU;
      sctx.moveTo(Math.cos(a)*e.irisR*0.22, Math.sin(a)*e.irisR*0.22);
      sctx.lineTo(Math.cos(a)*e.irisR*0.88, Math.sin(a)*e.irisR*0.88);
    }
    sctx.stroke();
    const lmx = mx - e.x, lmy = my - e.y;
    const c = Math.cos(-e.tilt), s = Math.sin(-e.tilt);
    const lx = lmx*c - lmy*s, ly = lmx*s + lmy*c;
    const ll = Math.hypot(lx, ly) || 1;
    const off = Math.min(ll*0.04, e.irisR*0.32);
    const px = (lx/ll)*off, py = (ly/ll)*off;
    sctx.fillStyle = "#050208";
    sctx.beginPath();
    sctx.ellipse(px, py, e.irisR*0.14, e.irisR*0.6*Math.max(open, 0.25), 0, 0, TAU);
    sctx.fill();
    sctx.fillStyle = "rgba(240,244,236,0.5)";
    sctx.beginPath();
    sctx.arc(px + e.irisR*0.1, py - e.irisR*0.2, e.irisR*0.05, 0, TAU);
    sctx.fill();
    sctx.restore();
    sctx.beginPath();
    sctx.moveTo(-e.rx, 0);
    sctx.quadraticCurveTo(0, -ry*2, e.rx, 0);
    sctx.quadraticCurveTo(0, ry*2, -e.rx, 0);
    sctx.closePath();
    sctx.strokeStyle = "rgba(200,160,190,0.25)";
    sctx.lineWidth = 1.4;
    sctx.stroke();
    sctx.restore();
  };

  const glitchPower = (elapsed) => {
    let p = 0;
    for (const q of glitches) {
      if (elapsed >= q.at && elapsed <= q.at + q.dur) p = Math.max(p, Math.sin(Math.PI*(elapsed-q.at)/q.dur));
    }
    return p;
  };
  const drawChannel = (tint, dx, dy) => {
    chctx.globalCompositeOperation = "source-over";
    chctx.clearRect(0, 0, chan.width, chan.height);
    chctx.drawImage(scene, 0, 0);
    chctx.globalCompositeOperation = "multiply";
    chctx.fillStyle = tint;
    chctx.fillRect(0, 0, chan.width, chan.height);
    chctx.globalCompositeOperation = "destination-in";
    chctx.drawImage(scene, 0, 0);
    ctx.drawImage(chan, dx, dy);
  };
  let shook = false;
  const composite = (power) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (power <= 0.02) {
      ctx.drawImage(scene, 0, 0);
      if (shook) { canvas.style.transform = ""; glowCanvas.style.transform = ""; shook = false; }
      return;
    }
    const s = (2 + 8*power) * DPR * rand(0.6, 1.4);
    ctx.globalCompositeOperation = "lighter";
    drawChannel("#ff0000", -s, 0);
    drawChannel("#00ff00", 0, 0);
    drawChannel("#0000ff", s, s*0.25);
    ctx.globalCompositeOperation = "source-over";
    const bands = 2 + Math.floor(rand(0, 3)*power);
    for (let b = 0; b < bands; b++) {
      const by = Math.random()*canvas.height;
      const bh = (5 + Math.random()*30)*DPR;
      const bx = (Math.random()*2 - 1)*(12 + 50*power)*DPR;
      ctx.drawImage(scene, 0, by, canvas.width, bh, bx, by, canvas.width, bh);
    }
    if (power > 0.6 && Math.random() < 0.25) {
      ctx.globalCompositeOperation = "difference";
      ctx.fillStyle = "rgba(0,190,170,0.6)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = "source-over";
    }
    const jx = (Math.random()*2-1)*3*power, jy = (Math.random()*2-1)*2*power;
    canvas.style.transform = `translate(${jx}px, ${jy}px)`;
    glowCanvas.style.transform = `translate(${jx}px, ${jy}px)`;
    shook = true;
  };

  let last = performance.now(), elapsed = 0, dim = 0;
  document.addEventListener("visibilitychange", () => { if (!document.hidden) last = performance.now(); });
  window.addEventListener("pointerdown", () => { if (gaze.state === "idle") gaze.next = elapsed; });

  const frame = (now) => {
    requestAnimationFrame(frame);
    let dt = (now - last)/1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    elapsed += dt;

    const cRect = canvas.getBoundingClientRect();
    const r = AVATAR.getBoundingClientRect();
    ax = r.left - cRect.left + r.width/2;
    ay = r.top - cRect.top + r.height/2;
    aR = r.width/2;
    mx = mouseClient.x - cRect.left;
    my = mouseClient.y - cRect.top;

    const growV = easeOutCubic(clamp01((elapsed - 0.3)/1.6));
    for (let i = 0; i < tents.length; i++) tents[i].grow = easeInOut(clamp01((elapsed - 1.6 - i*0.3)/2.2));

    if (gaze.state === "idle") {
      if (elapsed >= gaze.next) openGaze(elapsed);
    } else {
      gaze.t += dt;
      if (gaze.state === "opening" && gaze.t > 1.1 + 0.18*gaze.eyes.length) { gaze.state = "watching"; gaze.t = 0; }
      else if (gaze.state === "watching" && gaze.t > gaze.watchDur) { gaze.state = "closing"; gaze.t = 0; }
      else if (gaze.state === "closing" && gaze.t > 0.7) {
        gaze.state = "idle"; gaze.eyes = []; gaze.next = elapsed + rand(10, 15);
      }
    }
    const dimTarget =
      gaze.state === "opening" ? 0.22*clamp01(gaze.t/1.1) :
      gaze.state === "watching" ? 0.22 :
      gaze.state === "closing" ? 0.22*(1 - clamp01(gaze.t/0.7)) : 0;
    dim += (dimTarget - dim)*Math.min(1, dt*6);

    sctx.clearRect(0, 0, W, H);
    gctx.clearRect(0, 0, W, H);
    if (dim > 0.004) { sctx.fillStyle = `rgba(1,3,7,${dim})`; sctx.fillRect(0, 0, W, H); }
    for (const e of gaze.eyes) drawEye(e, eyeOpenness(e, elapsed));
    if (growV > 0.01) drawVoid(elapsed, growV);
    for (const T of tents) if (T.grow > 0.02) drawTentacle(T, elapsed);
    sctx.globalCompositeOperation = "destination-out";
    const hr = aR + 8;
    sctx.drawImage(holeFeather, ax-hr, ay-hr, hr*2, hr*2);
    sctx.globalCompositeOperation = "source-over";
    gctx.globalCompositeOperation = "destination-out";
    const ghr = aR + 4;
    gctx.drawImage(holeFeather, ax-ghr, ay-ghr, ghr*2, ghr*2);
    gctx.globalCompositeOperation = "source-over";
    gctx.strokeStyle = "rgba(30,200,190,0.85)";
    gctx.lineWidth = 2;
    gctx.beginPath();
    gctx.arc(ax, ay, aR + 1.5, 0, TAU);
    gctx.stroke();
    const rot = elapsed*0.5;
    gctx.strokeStyle = "rgba(230,45,195,0.95)";
    gctx.lineWidth = 2;
    gctx.beginPath();
    gctx.arc(ax, ay, aR + 1.5, rot, rot + 1.1);
    gctx.stroke();
    drawMist(dt, clamp01(elapsed/1.6));

    composite(glitchPower(elapsed));
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
