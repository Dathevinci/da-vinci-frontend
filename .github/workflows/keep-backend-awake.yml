name: Keep backend awake

# Render's free tier sleeps after ~15 min with no traffic, which causes the
# slow/failed first load after the site's been quiet. This pings the backend
# on a schedule so it stays warm.
#
# Interval is 5 min because GitHub's scheduled runs can be delayed under load —
# 5 min gives margin against Render's 15-min sleep. (This does NOT protect
# against a full Render platform incident; nothing on our side can. For a more
# punctual free option, point UptimeRobot at the same URL.)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: |
          # MUST stay on /health — it returns a static JSON object and touches
          # NOTHING else. This used to ping /api/system/status, which runs a
          # prisma query for the maintenance flag. That meant a database hit
          # every 5 minutes forever, and Neon only suspends compute after a
          # stretch with no connections — so the database could never idle and
          # burned its whole monthly compute allowance keeping Render awake.
          #
          # Any HTTP request keeps Render warm. It does not have to be one that
          # reaches the database.
          code=$(curl -s -o /dev/null -m 40 -w "%{http_code}" \
            https://da-vinci-backend.onrender.com/health || echo 000)
          echo "backend /health -> $code"
          # Always succeed — a transient down backend must not spam failure emails.
          exit 0
